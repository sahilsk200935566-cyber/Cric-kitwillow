<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;height:-webkit-fill-available;-webkit-text-size-adjust:100%;}
body{
  width:100%;min-height:100vh;min-height:100dvh;
  background-color:#050505;
  background-image:radial-gradient(ellipse at 50% 0%,rgba(0,229,255,.12) 0%,transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(0,119,255,.06) 0%,transparent 50%),url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");

}

/* Grid & Dashboard UI */
#overlay{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 30%,#050a12 0%,#050505 70%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.loader-wrap{position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center}
.loader-ring{position:absolute;inset:0;border-radius:50%;border:4px solid transparent;border-top-color:#00e5ff;border-right-color:rgba(0,229,255,.05);animation:spin 1.2s cubic-bezier(.55,.1,.45,.9) infinite}
.loader-ring-inner{position:absolute;inset:14px;border-radius:50%;border:4px solid transparent;border-bottom-color:#0077ff;border-left-color:rgba(0,119,255,.05);animation:spin-rev 1s cubic-bezier(.55,.1,.45,.9) infinite}
.loader-core{width:14px;height:14px;border-radius:50%;background:#00e5ff;box-shadow:0 0 20px #00e5ff,0 0 40px rgba(0,229,255,.4);animation:pulse-core 1.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin-rev{to{transform:rotate(-360deg)}}
@keyframes pulse-core{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.2);opacity:1}}

#video-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;background:rgba(0,0,0,.6)}
#video-loading.on{opacity:1}
.video-spinner{width:56px;height:56px;border:4px solid rgba(0,229,255,.12);border-top-color:#00e5ff;border-radius:50%;animation:spin .8s linear infinite}

#channel-list{position:relative;width:100%;min-height:100vh;display:none;flex-direction:column;padding:0 0 40px 0;z-index:1}
.header{padding:32px 16px 24px;text-align:center;}
.header h1{font-family: 'Inter', sans-serif;font-size:30px;font-weight:900;letter-spacing:.5px;background:linear-gradient(135deg,#00e5ff,#0077ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;text-transform:uppercase;filter:drop-shadow(0 2px 12px rgba(0,119,255,.35))}
.header p{font-size:14px;color:#8e8e9a;font-weight:500;max-width:400px;margin:0 auto;line-height:1.5}

.filters{display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px 24px;flex-wrap:wrap;}
.filter-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 22px;border-radius:30px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#b0b0bc;font-size:13px;font-weight:700;cursor:pointer;transition:all .25s ease;}
.filter-btn.active{background:linear-gradient(135deg,#00e5ff,#0077ff);color:#000;border-color:transparent;box-shadow:0 4px 20px rgba(0,229,255,.4)}
.filter-btn svg{width:16px;height:16px;fill:currentColor}

#ch-cards{display:flex;flex-direction:column;gap:20px;padding:0 16px;width:100%;max-width:480px;margin:0 auto}
.match-card{background:linear-gradient(168deg,#111116 0%,#0a0a0f 100%);border:1px solid rgba(0,229,255,.1);border-radius:18px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04);display:flex;flex-direction:column;transition:transform .2s ease,border-color .3s ease}
.match-card:active{transform:scale(.98)}
.match-card:hover{border-color:rgba(0,229,255,.3)}
.card-poster{position:relative;width:100%;background:#0d0d1c;overflow:hidden}
.card-poster img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;}
.card-poster::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 60%,rgba(10,10,15,.95) 100%);pointer-events:none}
.ribbon-clip{position:absolute;top:0;right:0;width:120px;height:120px;overflow:hidden;pointer-events:none;z-index:5}
.ribbon{position:absolute;top:30px;right:-35px;width:150px;text-align:center;transform:rotate(45deg);font-size:11px;font-weight:900;letter-spacing:2px;padding:8px 0;display:flex;align-items:center;justify-content:center;gap:6px;text-transform:uppercase}
.ribbon.live{background:linear-gradient(135deg,#e82000,#ff4422);color:#fff;box-shadow:0 4px 15px rgba(232,32,0,.5)}
.ribbon.upcoming{background:linear-gradient(135deg,#1e1e2e,#2a2a3e);color:#a0a0b0;border-top:1px solid rgba(255,255,255,.15);border-bottom:1px solid rgba(255,255,255,.15)}
.ribbon-dot{width:6px;height:6px;border-radius:50%;background:#fff;flex-shrink:0;animation:pulse-dot 1s ease-in-out infinite}
.ribbon.upcoming .ribbon-dot{display:none}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}

.card-info{padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1;margin-top:-30px;}
.card-title{font-size:17px;font-weight:800;color:#fff;line-height:1.4;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.card-subtitle{font-size:13px;font-weight:600;color:#00e5ff;line-height:1.4}
.card-meta{display:flex;align-items:center;gap:14px;font-size:12px;font-weight:600;color:#8e8e9a}
.card-meta span{display:flex;align-items:center;gap:5px}

.streams-section{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06)}
.streams-btns{display:flex;gap:8px;flex-wrap:wrap;width:100%;}
.stream-btn{flex:1;min-width:45%;display:inline-flex;align-items:center;justify-content:center;padding:12px 10px;border-radius:10px;background:linear-gradient(135deg, #00e5ff 0%, #0077ff 100%);color:#000;font-size:13px;font-weight:800;text-decoration:none;text-align:center;transition:all .25s ease;}
.stream-btn:active{transform:scale(.96)}
.upcoming-btn{width:100%;display:inline-flex;align-items:center;justify-content:center;padding:16px;border-radius:12px;background:linear-gradient(180deg,rgba(40,40,55,1),rgba(25,25,35,1));border:1px solid rgba(0,229,255,.2);color:#00e5ff;font-size:14px;font-weight:900;cursor:pointer;transition:all .25s ease;text-transform:uppercase;letter-spacing:1.5px;position:relative;}

/* Custom Video Player UI */
#pc{position:fixed;inset:0;background:#000;display:none;user-select:none;-webkit-user-select:none;overflow:hidden;z-index:999;}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center center;transition:transform .3s ease;touch-action:none;}

#video-overlay{position:absolute;inset:0;z-index:10;background:#080808;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s;}
#video-overlay.gone{opacity:0;pointer-events:none;}
.load-label{font-size:12px;color:rgba(255,255,255,.38);letter-spacing:.4px;}

#bufspin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;display:none;}
#bufspin div{width:32px;height:32px;border:2.5px solid rgba(255,255,255,.12);border-top-color:rgba(0,229,255,.75);border-radius:50%;animation:rot .65s linear infinite;}

#err-ov{position:absolute;inset:0;z-index:11;background:#0d0d16;display:none;align-items:center;justify-content:center;padding:24px;}
#err-ov.show{display:flex;}
.ec{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:20px;padding:44px 28px 36px;max-width:380px;width:100%;text-align:center;}
.ec .etxt{font-size:19px;font-weight:700;color:#efefef;margin-bottom:8px;}
.ec .emsg{font-size:13px;color:rgba(255,255,255,.38);line-height:1.75;margin-bottom:22px;}
.elink{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:50px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.13);color:#fff;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;}

#bigplay{position:absolute;inset:0;z-index:16;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .22s;}
#bigplay.shown{pointer-events:none;opacity:1;}
#bigplay.gone{opacity:0;pointer-events:none;}
.bpbtn{position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.35), transparent 55%), linear-gradient(145deg, rgba(255,255,255,.22), rgba(255,255,255,.05));-webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%);border:1.5px solid rgba(255,255,255,.5);box-shadow:0 10px 32px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;}
.bpbtn svg{position:relative;z-index:1;width:26px;height:26px;margin-left:3px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));}

#ctrls{position:absolute;bottom:0;left:0;right:0;z-index:20;transition:opacity .3s,transform .3s;padding:40px 0 7px;background:linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.67) 42%, rgba(0,0,0,.2) 77%, rgba(0,0,0,0) 100%);}
#ctrls.gone{opacity:0;pointer-events:none;transform:translateY(6px);}

#prog{margin:0 13px 2px;height:16px;display:flex;align-items:center;cursor:pointer;position:relative;}
.pt{position:relative;height:3px;width:100%;background:rgba(255,255,255,.15);border-radius:4px;transition:height .18s ease;box-shadow:inset 0 1px 2px rgba(0,0,0,.3);}
#prog:hover .pt,#prog.drag .pt{height:5px;}
.pbf{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.28);border-radius:4px;width:0;}
.ppl{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#00e5ff 0%,#0077ff 100%);border-radius:4px;width:0;box-shadow:0 0 12px rgba(0,229,255,.55);}
.pth{position:absolute;top:50%;left:0;width:12px;height:12px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.55),0 0 0 3px rgba(255,255,255,.12);pointer-events:none;opacity:0;transition:opacity .18s;}

#crow{position:relative;display:flex;align-items:center;margin:0 6px;padding:4px 7px;gap:5px;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.045));backdrop-filter:blur(20px) saturate(145%);}
.cb{position:relative;width:34px;height:34px;border-radius:10px;background:radial-gradient(circle at 28% 18%, rgba(255,255,255,.2), transparent 56%), linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.055));border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:transform .22s;}
.cb:hover{transform:translateY(-1.5px);border-color:rgba(255,255,255,.35);}
.cb svg{position:relative;z-index:1;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
.csp{flex:1;}

@keyframes muteGlow{
  0%,100%{box-shadow:0 4px 14px rgba(0,0,0,.38),inset 0 1.5px 0 rgba(255,255,255,.28),0 0 0 0 rgba(255,90,80,.4);}

}

.live-pill{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:9px;background:radial-gradient(circle at 25% 20%, rgba(255,140,140,.28), transparent 60%),linear-gradient(135deg, rgba(255,60,60,.22), rgba(255,60,60,.08));border:1px solid rgba(255,80,80,.4);font-size:10px;font-weight:800;letter-spacing:.8px;color:#ff5252;cursor:default;flex-shrink:0;}

@keyframes lblink{0%,100%{opacity:1;}50%{opacity:.35;}}

#bq{border-radius:10px !important;width:auto !important;padding:0 8px !important;height:34px !important;gap:4px;}
#qlbl{font-size:10.5px;font-weight:700;letter-spacing:.25px;}
.qchev{flex-shrink:0;opacity:.65;}
#bfill{width:auto !important;min-width:48px;padding:0 7px !important;gap:4px;}
#filllbl{font:700 8px/1 'Poppins',sans-serif;letter-spacing:.35px;}

#muteHint{position:absolute;bottom:82px;left:50%;transform:translateX(-50%) translateY(8px);z-index:22;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 12px;border-radius:50px;background:linear-gradient(135deg, rgba(255,60,60,.9), rgba(255,90,80,.85));border:1px solid rgba(255,255,255,.25);font-size:12px;font-weight:700;color:#fff;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s;white-space:nowrap;}

</style>

<script>
(function(){
"use strict";

var API_1 = "https://sonujson-v6.pages.dev/Data/willow.json";
var API_2 = "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.json";
var WA_CHANNEL = "https://t.me/cric_Kit";

window.shakaPlayerInstance = null;
window.hlsInstance = null;

// DOM Elements
var $list = document.getElementById("channel-list");
var $cards = document.getElementById("ch-cards");
var $pc = document.getElementById("pc");
var $vid = document.getElementById("vid");
var $overlay = document.getElementById("video-overlay");
var $errOv = document.getElementById("err-ov");
var $muteHint = document.getElementById("muteHint");
var $ctrls = document.getElementById("ctrls");

var _channels = [];
var _currentFilter = "all";
var userUnmuted = false;
var hideTimer = null;
var isPopupTriggered = false;

// ----------------------------------------------------
// FULL ROBUST JSON PARSER & MERGER (Fixes Match Not Found)
// ----------------------------------------------------
function fetchJSON(url){
  var sep = url.indexOf("?") === -1 ? "?" : "&";
  return fetch(url + sep + "_=" + Date.now()).then(r => r.json());
}

function extractList(data){
  if(Array.isArray(data)) return data;
  if(data && typeof data === 'object'){
    if(Array.isArray(data.Matches)) return data.Matches; 
    if(Array.isArray(data.matches)) return data.matches;
    if(Array.isArray(data.channels)) return data.channels;
    if(Array.isArray(data.events)) return data.events;
    if(Array.isArray(data.streams)) return data.streams;
    if(Array.isArray(data.data)) return data.data;
    for (let key in data) { if(Array.isArray(data[key])) return data[key]; }
  }
  return [];
}

function standardizeChannel(ch) {
  let id = String(ch.id || ch.match_id || "").trim();
  if (!id) return null;

  let title = (ch.title || ch.event_name || ch.name || "Live Match").trim();
  let tournament = (ch.tournament || ch.series || "").trim();
  let image = ch.image || ch.cover_image || ch.logo || "https://i.ibb.co/nGrvNDP/file-00000000c6b08211807a5ca56f788468.png";
  let isLive = String(ch.status || "").toUpperCase() === "LIVE";
  let time = ch.time || "TBA";
  let drm_key = ch.drm_key || "";

  let streams = [];

  if (ch.streams && typeof ch.streams === 'object' && !Array.isArray(ch.streams)) {
      if (ch.streams.primary) streams.push({ name: 'Server 1', url: ch.streams.primary });
      if (ch.streams.fancode_cdn) streams.push({ name: 'Server 2', url: ch.streams.fancode_cdn });
  }
  if (ch.auto_streams) {
      let pxUrl = Object.values(ch.auto_streams).map(v => v && v.sonu_px).find(Boolean);
      if (pxUrl) streams.push({ name: 'Ads Free', url: pxUrl });
  }

  if (ch.stream_url_bravo) {
      let bravo = ch.stream_url_bravo;
      if (bravo["Akamai Server"]) streams.push({ name: 'Server 1', url: bravo["Akamai Server"] });
      else if (Object.values(bravo)[0]) streams.push({ name: 'Server 1', url: Object.values(bravo)[0] });
  }
  if (ch.stream_url_alpha) {
      let alpha = ch.stream_url_alpha;
      if (alpha["Akamai Server"]) streams.push({ name: 'Server 2', url: alpha["Akamai Server"] });
      else if (Object.values(alpha)[0]) streams.push({ name: 'Server 2', url: Object.values(alpha)[0] });
  }

  if (ch.stream_url && streams.length === 0) {
      streams.push({ name: 'Watch Now', url: ch.stream_url });
  }
  
  if (ch.CnpTV) {
      if (ch.CnpTV["fastly_server1"]) streams.push({ name: 'Fastly', url: ch.CnpTV["fastly_server1"] });
      if (ch.CnpTV["akamai_server1"]) streams.push({ name: 'Akamai', url: ch.CnpTV["akamai_server1"] });
      if (ch.CnpTV["akamai_server2"]) streams.push({ name: '4K Stream', url: ch.CnpTV["akamai_server2"] });
  }

  return { id, title, tournament, image, status: isLive ? 'LIVE' : 'UPCOMING', isLive, time, streams, drm_key };
}

function loadChannels(){
  return Promise.allSettled([fetchJSON(API_1), fetchJSON(API_2)]).then(results => {
      var finalMatches = [];
      results.forEach(r => { 
        if(r.status === "fulfilled" && r.value){ 
          extractList(r.value).forEach(rawCh => {
            let ch = standardizeChannel(rawCh);
            if(ch && ch.id){ 
                // Check if match already exists (by ID or exact Title)
                let existing = finalMatches.find(m => m.id === ch.id || m.title.toLowerCase() === ch.title.toLowerCase());
                
                if (!existing) {
                    finalMatches.push(ch);
                } else {
                    // Combine streams into the existing match to get multiple buttons
                    let existingUrls = new Set(existing.streams.map(s => s.url));
                    ch.streams.forEach(s => {
                        if(s.url && !existingUrls.has(s.url)) {
                            existing.streams.push(s);
                            existingUrls.add(s.url);
                        }
                    });
                    if(ch.isLive) {
                        existing.isLive = true;
                        existing.status = 'LIVE';
                    }
                }
            }
          });
        }
      });
      
      // Cleanup button names
      finalMatches.forEach(ch => {
          if (ch.streams.length === 1 && ch.streams[0].name !== 'Ads Free') {
              ch.streams[0].name = "WATCH NOW";
          } else if (ch.streams.length > 1) {
              let counter = 1;
              ch.streams.forEach(s => {
                  if(s.name === "Watch Now" || s.name.startsWith("Server")) {
                      s.name = "SERVER " + counter;
                      counter++;
                  }
              });
          }
      });
      return finalMatches;
  });
}

// ----------------------------------------------------
// UI Logic: WhatsApp Auto Popup & Rotate
// ----------------------------------------------------
var $popup = document.getElementById("waAutoPopup");
function enterFullscreenAndRotate() {
    const container = document.documentElement;
    if (container.requestFullscreen) { container.requestFullscreen().catch(()=>{}); }
    else if (container.webkitRequestFullscreen) { container.webkitRequestFullscreen(); }
    if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(() => {}); }
}

function hidePopup() {
    $popup.style.opacity = '0';
    $popup.style.transition = 'opacity 0.2s ease-out';
    setTimeout(() => {
        $popup.classList.remove('visible');
        enterFullscreenAndRotate();
    }, 220);
}
document.getElementById('waAutoJoin').onclick = () => { window.open(WA_CHANNEL, '_blank'); hidePopup(); };
document.getElementById('waAutoSkip').onclick = hidePopup;
document.getElementById('waAutoClose').onclick = hidePopup;
document.getElementById('bwap').onclick = (e) => { e.stopPropagation(); window.open(WA_CHANNEL, '_blank'); };

document.getElementById('shareBtn').onclick = async (e) => {
  e.stopPropagation();
  try{ await navigator.share({title:'RKTV LIVE',url:window.location.href}); }
  catch(e){ navigator.clipboard.writeText(window.location.href); alert('Link Copied!'); }
};

function checkMuteAndPopup() {
  if (isPopupTriggered) return;
  if (!$vid.muted && $vid.volume > 0) {
      isPopupTriggered = true;
      setTimeout(() => { $popup.classList.add('visible'); }, 5000); 
  }
}
$vid.addEventListener('volumechange', checkMuteAndPopup);
$vid.addEventListener('playing', checkMuteAndPopup);

$pc.addEventListener('click', function(e) {
  if (e.target.closest('#crow') || e.target.closest('#muteHint')) return;
  if ($vid.muted) {
    $vid.muted = false;
    userUnmuted = true;
    $muteHint.style.opacity = '0';
    checkMuteAndPopup();
  }
  showCtrls();
});

function showCtrls(){
  $ctrls.classList.remove('gone');
  clearTimeout(hideTimer);
  if (!$vid.paused) hideTimer = setTimeout(() => { $ctrls.classList.add('gone'); }, 3000);
}

// ----------------------------------------------------
// Dashboard Grid Rendering (Multi-buttons support)
// ----------------------------------------------------
function renderLanding(channels){
  $cards.innerHTML = "";
  var filtered = channels.filter(ch => {
    if(_currentFilter === "live") return ch.isLive;
    if(_currentFilter === "upcoming") return !ch.isLive;
    return true;
  });
  if(filtered.length === 0){ $cards.innerHTML = '<div style="text-align:center;padding:40px;color:#fff;">No Matches Found</div>'; return; }

  filtered.forEach(ch => {
    var card = document.createElement("div"); card.className = "match-card";
    
    var streamsHtml = '';
    if (ch.streams && ch.streams.length > 0) {
        var btns = ch.streams.map((s, idx) => `<a class="stream-btn" href="?id=${ch.id}&srv=${idx}">${s.name}</a>`).join('');
        streamsHtml = `<div class="streams-btns" style="display:flex;gap:8px;flex-wrap:wrap;width:100%;">${btns}</div>`;
    } else {
        streamsHtml = `<button class="upcoming-btn" onclick="alert('Event Not Started Yet')">UPCOMING</button>`;
    }

    card.innerHTML = `
      <div class="card-poster">
        <img src="${ch.image}" alt="Match" loading="lazy">
        <div class="ribbon-clip"><div class="ribbon ${ch.isLive?'live':'upcoming'}"><span class="ribbon-dot"></span>${ch.status}</div></div>
      </div>
      <div class="card-info">
        <div class="card-title">${ch.title}</div>
        <div class="card-subtitle">${ch.tournament}</div>
        <div class="card-meta"><span>Time: ${ch.time}</span></div>
        <div class="streams-section">
          ${streamsHtml}
        </div>
      </div>`;
    $cards.appendChild(card);
  });
  $list.style.display = "flex";
}

// ----------------------------------------------------
// Universal Dynamic Quality Selector
// ----------------------------------------------------
document.getElementById('bq').addEventListener('click', function(e) {
  e.stopPropagation();
  e.preventDefault();

  var options = [{ label: 'Auto', id: -1 }];
  var isShaka = !!window.shakaPlayerInstance;
  var isHls = !!window.hlsInstance;

  if (isShaka) {
    var tracks = window.shakaPlayerInstance.getVariantTracks();
    var heights = Array.from(new Set(tracks.map(t => t.height))).filter(Boolean).sort((a, b) => b - a);
    heights.forEach(h => options.push({ label: h + 'p', id: h }));
  } else if (isHls) {
    var levels = window.hlsInstance.levels;
    levels.forEach((lvl, i) => {
      if (lvl.height) options.push({ label: lvl.height + 'p', id: i });
    });
    options = [{label:'Auto', id:-1}].concat(options.slice(1).sort((a,b)=>parseInt(b.label)-parseInt(a.label)));
  }

  if (options.length <= 1) {
    alert("Multiple qualities not available for this stream.");
    return;
  }

  var rect = this.getBoundingClientRect();
  var sel = document.createElement('select');
  sel.style.cssText = 'position:fixed;opacity:0.01;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;height:'+rect.height+'px;z-index:10000;';
  
  options.forEach(opt => {
    var o = document.createElement('option');
    o.value = opt.id;
    o.textContent = opt.label;
    sel.appendChild(o);
  });

  sel.onchange = function() {
    var val = parseInt(sel.value);
    var label = options.find(o => o.id === val).label;
    document.getElementById('qlbl').textContent = label;

    if (isShaka) {
      if (val === -1) {
        window.shakaPlayerInstance.configure({ abr: { enabled: true } });
      } else {
        window.shakaPlayerInstance.configure({ abr: { enabled: false } });
        var tracks = window.shakaPlayerInstance.getVariantTracks();
        var targetTrack = tracks.find(t => t.height === val);
        if (targetTrack) window.shakaPlayerInstance.selectVariantTrack(targetTrack, true);
      }
    } else if (isHls) {
      window.hlsInstance.currentLevel = val;
    }
    sel.remove();
  };

  sel.onblur = function() { sel.remove(); };
  document.body.appendChild(sel);
  sel.focus();
  try { sel.showPicker(); } catch(err) { sel.click(); }
});

// ----------------------------------------------------
// Custom Video Player Engine (Shaka/HLS)
// ----------------------------------------------------
function startPlayer(ch, srvIdx){
  $list.style.display = "none";
  $pc.style.display = "block";

  var streamObj = ch.streams[srvIdx] || ch.streams[0];
  var streamUrl = streamObj ? streamObj.url : "";

  if(!streamUrl){
    $overlay.classList.add('gone');
    $errOv.classList.add('show');
    return;
  }

  $vid.muted = true;
  $muteHint.style.opacity = '1';
  document.getElementById('qlbl').textContent = 'Auto'; 

  if(window.shakaPlayerInstance) { window.shakaPlayerInstance.destroy(); window.shakaPlayerInstance = null; }
  if(window.hlsInstance) { window.hlsInstance.destroy(); window.hlsInstance = null; }

  if (streamUrl.includes('.mpd') || ch.drm_key) {
    shaka.polyfill.installAll();
    if (shaka.Player.isBrowserSupported()) {
      window.shakaPlayerInstance = new shaka.Player($vid);
      
      var p = String(ch.drm_key || "").split(":");
      if(p.length >= 2) window.shakaPlayerInstance.configure({ drm: { clearKeys: { [p[0].trim()]: p[1].trim() } } });
      
      window.shakaPlayerInstance.load(streamUrl).then(() => {
        $vid.play().catch(()=>{});
        $overlay.classList.add('gone');
      }).catch(e => { $overlay.classList.add('gone'); $errOv.classList.add('show'); });
    }
  } else if (window.Hls && Hls.isSupported()) {
    window.hlsInstance = new Hls();
    window.hlsInstance.loadSource(streamUrl);
    window.hlsInstance.attachMedia($vid);
    window.hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { $vid.play().catch(()=>{}); $overlay.classList.add('gone'); });
    window.hlsInstance.on(Hls.Events.ERROR, (e,d) => { if(d.fatal){ $overlay.classList.add('gone'); $errOv.classList.add('show'); } });
  } else if ($vid.canPlayType('application/vnd.apple.mpegurl')) {
    $vid.src = streamUrl;
    $vid.addEventListener('loadedmetadata', () => { $vid.play().catch(()=>{}); $overlay.classList.add('gone'); });
  }
}

// Controls Sync
var $bplay = document.getElementById("bplay"), $pico = document.getElementById("pico");
var $bvol = document.getElementById("bvol"), $vico = document.getElementById("vico");
var $prog = document.getElementById("prog"), $ppl = document.getElementById("ppl"), $pth = document.getElementById("pth");

$bplay.onclick = (e) => { e.stopPropagation(); $vid.paused ? $vid.play() : $vid.pause(); };
$vid.addEventListener('play', () => { $pico.innerHTML = '<rect x="6" y="4.5" width="4" height="15" rx="1.2"></rect><rect x="14" y="4.5" width="4" height="15" rx="1.2"></rect>'; showCtrls(); });
$vid.addEventListener('pause', () => { $pico.innerHTML = '<path d="M7 4.5v15l13-7.5L7 4.5z"></path>'; showCtrls(); });

$bvol.onclick = (e) => { 
  e.stopPropagation(); 
  $vid.muted = !$vid.muted; 
  if(!$vid.muted){ userUnmuted=true; $muteHint.style.opacity='0'; checkMuteAndPopup(); }
};
$vid.addEventListener('volumechange', () => {
  $bvol.classList.toggle('is-muted', $vid.muted);
  $vico.innerHTML = $vid.muted ? '<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"></path><path d="M16.5 8.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.8"></path>' 
                               : '<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"></path><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8"></path><path d="M19 6a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.8"></path>';
});

// Progress Bar
var isDragging = false;
function setP(p){ p = Math.max(0, Math.min(100, p)); $ppl.style.width = p + '%'; $pth.style.left = p + '%'; }
$vid.addEventListener('timeupdate', () => {
  if(!isDragging && $vid.duration) setP(($vid.currentTime / $vid.duration) * 100);
});

// View Fit
var FITS = ["contain","fill","cover"], fitIdx = 0;
document.getElementById('bfill').onclick = (e) => {
  e.stopPropagation();
  fitIdx = (fitIdx+1)%3;
  $vid.style.objectFit = FITS[fitIdx];
  document.getElementById('filllbl').innerText = FITS[fitIdx].toUpperCase();
};

// Fullscreen
document.getElementById('bfs').onclick = (e) => {
  e.stopPropagation();
  if(!document.fullscreenElement) { $pc.requestFullscreen().catch(()=>{}); if(screen.orientation) screen.orientation.lock('landscape').catch(()=>{}); }
  else document.exitFullscreen().catch(()=>{});
};

document.getElementById('retryNow').onclick = () => location.reload();

document.getElementById("filters").addEventListener("click", e => {
  var btn = e.target.closest(".filter-btn"); if(!btn) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active"); _currentFilter = btn.getAttribute("data-filter");
  renderLanding(_channels);
});

// ----------------------------------------------------
// Init - ADVANCED URL PARSER
// ----------------------------------------------------
function main(){
  var s = location.search;
  var params = new URLSearchParams(s);
  var reqId = params.get('id');
  
  if(!reqId && s.length > 1) {
      // Handle old bookmark format ?CB04&ser=1
      var firstPart = s.slice(1).split("&")[0];
      if(firstPart && !firstPart.includes("=")) reqId = firstPart;
  }
  
  var srvIdx = parseInt(params.get('srv'));
  if(isNaN(srvIdx)) srvIdx = parseInt(params.get('ser'));
  if(isNaN(srvIdx)) srvIdx = 0;

  loadChannels().then(channels => {
    _channels = channels;
    if(!reqId) { 
      renderLanding(channels); 
      return; 
    }
    
    var ch = channels.find(c => {
        let cid = String(c.id).trim();
        if(cid === reqId) return true;
        // Old ID match logic (?CB04 equals ID 4)
        if(reqId.toUpperCase().startsWith("CB")) {
            if(parseInt(reqId.replace(/[^0-9]/g, "")) === parseInt(cid)) return true;
        }
        return false;
    });
    
    if(ch) {
      startPlayer(ch, srvIdx); 
    } else { 
      alert("Match not found"); 
      renderLanding(channels); 
    }
  }).catch(e => { alert("Failed to load match data"); });
}

document.addEventListener("DOMContentLoaded", main);

})();
</script>
