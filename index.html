    (function tryInject(){
      if(injectFitBtn($pc, $vid)) return;
      if(++_injectN &lt; 5) setTimeout(tryInject, 150);
    })();

    player.getNetworkingEngine().registerRequestFilter(function(type, req){
      req.headers[&#34;Referer&#34;] = &#34;https://www.amazon.com/gp/&#34;;
      req.headers[&#34;User-Agent&#34;] = &#34;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36&#34;;
    });

    $vid.muted = true;
    (function(){
      function doUnmute(){ $vid.muted = false; }
      $pc.addEventListener(&#34;pointerdown&#34;, doUnmute, {capture:true, once:true});
      $pc.addEventListener(&#34;click&#34;, doUnmute, {capture:true, once:true});
    })();

    function buildCfg(){
      var cfg = {
        manifest:{
          defaultPresentationDelay:4,
          ignoreTextStreamFailures:true,
          dash:{autoCorrectDrift:true, ignoreMinBufferTime:true},
          retryParameters:{baseDelay:100}
        },
        abr:{
          enabled:true,
          defaultBandwidthEstimate:PROF.bwEst,
          bandwidthUpgradeTarget:.85,
          bandwidthDowngradeTarget:.95,
          restrictions:{maxHeight:1080}
        }
      };
      if(drm) cfg.drm = {clearKeys:{[drm.keyId]:drm.key}, retryParameters:{baseDelay:100}};
      return cfg;
    }

    function applyStreamingCfg(){
      player.configurationForLowLatency({
        streaming:{
          inaccurateManifestTolerance:0,
          segmentPrefetchLimit:2,
          updateIntervalSeconds:.1,
          maxDisabledTime:1,
          bufferingGoal:PROF.buf,
          rebufferingGoal:PROF.reBuf,
          bufferBehind:PROF.behind,
          safeSeekOffset:3,
          retryParameters:{baseDelay:100, maxAttempts:5, backoffFactor:1.5, fuzzFactor:.5}
        },
        manifest:{dash:{autoCorrectDrift:true}, retryParameters:{baseDelay:100}},
        drm:{retryParameters:{baseDelay:100}}
      });
    }

    function load(){
      var url = resolveUrl();
      if(!url){ toast(&#34;Connecting...&#34;, &#34;warn&#34;, 0); return; }
      toast(&#34;Connecting...&#34;, &#34;warn&#34;, 0);
      player.configure(buildCfg());
      applyStreamingCfg();
      player.load(url).then(function(){
        $vid.play().catch(function(){});
      }).catch(function(e){
        console.error(&#34;Load failed:&#34;, e &amp;&amp; e.code, e &amp;&amp; e.message);
        toast(&#34;Reconnecting...&#34;, &#34;warn&#34;, 0);
        setTimeout(load, RETRY_DELAY);
      });
    }

    player.addEventListener(&#34;error&#34;, function(ev){
      var err = ev.detail;
      if(err &amp;&amp; err.severity === shaka.util.Error.Severity.RECOVERABLE) return;
      console.error(&#34;Shaka error:&#34;, err &amp;&amp; err.code, err &amp;&amp; err.message);
      toast(&#34;Reconnecting...&#34;, &#34;warn&#34;, 0);
      setTimeout(load, RETRY_DELAY);
    });

    $vid.addEventListener(&#34;playing&#34;, function(){
      started = true;
      hideVidLoader();
      toast(&#34;Live&#34;, &#34;live&#34;, 3000);
    });

    document.addEventListener(&#34;visibilitychange&#34;, function(){
      if(!document.hidden) setTimeout(function(){
        if(started &amp;&amp; $vid.paused) $vid.play().catch(function(){});
      }, 400);
    });

    document.addEventListener(&#34;fullscreenchange&#34;, onFSChange);
    document.addEventListener(&#34;webkitfullscreenchange&#34;, onFSChange);
    function onFSChange(){
      var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      if(fsEl &amp;&amp; screen.orientation &amp;&amp; screen.orientation.lock){
        screen.orientation.lock(&#34;landscape&#34;).catch(function(){});
      } else if(!fsEl &amp;&amp; screen.orientation &amp;&amp; screen.orientation.unlock){
        try{ screen.orientation.unlock(); }catch(e){}
      }
    }

    hideOverlay();
    load();
  });
}

document.getElementById(&#34;filters&#34;).addEventListener(&#34;click&#34;, function(e){
  var btn = e.target.closest(&#34;.filter-btn&#34;);
  if(!btn) return;
  document.querySelectorAll(&#34;.filter-btn&#34;).forEach(function(b){ b.classList.remove(&#34;active&#34;); });
  btn.classList.add(&#34;active&#34;);
  _currentFilter = btn.getAttribute(&#34;data-filter&#34;);
  renderLanding(_channels);
});

function main(){
  var info = getStreamInfo();

  loadChannels().then(function(channels){
    _channels = channels;
    if(!info.id){
      renderLanding(channels);
      return;
    }

    var id = info.id;
    var cleanId = id.replace(/[^0-9]/g, &#34;&#34;);
    var ch = channels.find(function(c){ return String(c.id || &#34;&#34;).trim().replace(/[^0-9]/g, &#34;&#34;) === cleanId; });

    if(!ch){
      hideOverlay();
      toast(&#34;Stream Not Found: &#34; + id, &#34;err&#34;, 0);
      return;
    }

    document.title = &#34;CnpTV \u2014 &#34; + id;
    startPlayer(ch, info.srv);
  }).catch(function(e){
    hideOverlay();
    toast(&#34;Connection Error \u2014 Refresh to retry&#34;, &#34;err&#34;, 0);
    console.error(&#34;API load failed:&#34;, e);
  });
}

if(document.readyState === &#34;loading&#34;){
  document.addEventListener(&#34;DOMContentLoaded&#34;, main);
} else {
  main();
}

})();
    </script>
